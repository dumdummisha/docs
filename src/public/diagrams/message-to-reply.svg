<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" role="img" aria-labelledby="title desc" font-family="Figtree, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="title">How a Slack message reaches your clone and its reply gets back</title>
<desc id="desc">Inside your Mac: your signed-in Slack tab, the browser extension, the native host, the Misha app, the clone turn and workers. Outside: Slack, Anthropic, OpenAI and the services you connect. Twelve numbered steps, described in the list under the diagram, carry a message in, the reply out, and work to workers and back.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f1b16"/></marker></defs>
<rect width="1060" height="700" fill="#fffef8"/>
