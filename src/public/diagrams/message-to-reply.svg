<text x="965.0" y="321.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">OpenAI</text>
<text x="965.0" y="338.1" text-anchor="middle" font-size="13" fill="#1f1b16">GPT, through OpenCode</text>
<rect x="890" y="400" width="150" height="92" rx="4" fill="#ffffff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="965.0" y="433.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Connected services</text>
<text x="965.0" y="450.6" text-anchor="middle" font-size="13" fill="#1f1b16">GitHub, Jira, Google,</text>
<text x="965.0" y="467.6" text-anchor="middle" font-size="13" fill="#1f1b16">Figma, Fireflies, AWS</text>
<rect x="890" y="560" width="150" height="70" rx="4" fill="#ffffff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="965.0" y="591.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Anthropic</text>
<text x="965.0" y="608.0" text-anchor="middle" font-size="13" fill="#1f1b16">Claude, your plan</text>
<rect x="240" y="60" width="280" height="80" rx="4" fill="#ffffff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="380.0" y="87.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Your signed-in Slack tab</text>
<text x="380.0" y="104.5" text-anchor="middle" font-size="13" fill="#1f1b16">observer and relay of the</text>
<text x="380.0" y="121.5" text-anchor="middle" font-size="13" fill="#1f1b16">Misha Browser extension</text>
<rect x="240" y="176" width="280" height="64" rx="4" fill="#ffffff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="380.0" y="204.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Extension service worker</text>
<text x="380.0" y="221.1" text-anchor="middle" font-size="13" fill="#1f1b16">queue of new messages</text>
<rect x="240" y="276" width="280" height="64" rx="4" fill="#ffffff" stroke="#1f1b16" stroke-width="1.5"/>
<text x="380.0" y="304.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Native host and relay</text>
<text x="380.0" y="321.1" text-anchor="middle" font-size="13" fill="#1f1b16">a socket only you can open</text>
<rect x="240" y="376" width="280" height="80" rx="4" fill="#ffcf4a" stroke="#1f1b16" stroke-width="1.5"/>
<text x="380.0" y="403.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Misha app</text>
<text x="380.0" y="420.6" text-anchor="middle" font-size="13" fill="#1f1b16">filter, inbox and routing,</text>
<text x="380.0" y="437.6" text-anchor="middle" font-size="13" fill="#1f1b16">provenance ledger</text>
<rect x="240" y="496" width="280" height="80" rx="4" fill="#ffcf4a" stroke="#1f1b16" stroke-width="1.5"/>
<text x="380.0" y="523.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Clone turn</text>
<text x="380.0" y="540.5" text-anchor="middle" font-size="13" fill="#1f1b16">restricted Claude Code,</text>
<text x="380.0" y="557.5" text-anchor="middle" font-size="13" fill="#1f1b16">one shared session</text>
<rect x="580" y="376" width="240" height="80" rx="4" fill="#ffeeb0" stroke="#1f1b16" stroke-width="1.5"/>
<text x="700.0" y="403.6" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Workers</text>
<text x="700.0" y="420.6" text-anchor="middle" font-size="13" fill="#1f1b16">separate sessions, in worktrees</text>
<text x="700.0" y="437.6" text-anchor="middle" font-size="13" fill="#1f1b16">named for the work they do</text>
