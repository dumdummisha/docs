<text x="100.0" y="96.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f1b16">Slack</text>
<text x="100.0" y="113.0" text-anchor="middle" font-size="13" fill="#1f1b16">Slack&#x27;s servers</text>
